
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ColorNumberPredictionApp_NEW.zip'
      - 'ColorNumberPredictionApp.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        shell: bash
        run: |
          if [ -f "ColorNumberPredictionApp_NEW.zip" ]; then
            ARCHIVE="ColorNumberPredictionApp_NEW.zip"
          elif [ -f "ColorNumberPredictionApp.zip" ]; then
            ARCHIVE="ColorNumberPredictionApp.zip"
          else
            echo "Project ZIP not found in repository root"
            exit 1
          fi

          unzip -o "$ARCHIVE" -d project

      - name: Build APK
        run: |
          cd project/ColorNumberPredictionApp
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: ColorNumberPredictionApp-debug
          path: project/ColorNumberPredictionApp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

